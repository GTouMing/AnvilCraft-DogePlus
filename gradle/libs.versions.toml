[versions]
minecraft = "1.21.1"
neoForge = "21.1.241"
anvillib = "2.0.0+snapshot.550"
anvilcraft = "1.6.0+snapshot.2616"
ageratum = "0.0.1+build.111"
jei = "19.21.0.247"
curios = "9.5.1+1.21.1"
jade = "iku9fmp8"
# AE2（应用能源2）：官方 Maven Central 坐标，POM 会带上运行时依赖 GuideME
ae2 = "19.2.18"
# Storage Drawers：必须用 NeoForge 版本 ID（px0CCB06），
# 因为 "1.21.1-13.11.4" 被 fabric/forge/neoforge 共用，按版本号会拉到 fabric 版
storagedrawers = "px0CCB06"
# Sodium：仅开发环境验证半透明渲染（client-only）。1.21.1 的 LTS 分支为 0.6.x/0.8.x，
# 本模组的 multipart 兼容性针对该分支，故固定到 1.21.1 的 0.8.13 版本号。
sodium = "mc1.21.1-0.8.13-neoforge"
modDevGradle = "2.0.142"
lombok = "8.7.1"

[libraries]
anvillib = { group = "dev.anvilcraft.lib", name = "anvillib-neoforge-1.21.1", version.ref = "anvillib" }
anvilcraft = { group = "dev.dubhe", name = "anvilcraft-neoforge-1.21.1", version.ref = "anvilcraft" }
ageratum = { group = "dev.anvilcraft.resource", name = "ageratum-neoforge-1.21.1", version.ref = "ageratum" }
jei = { group = "mezz.jei", name = "jei-1.21.1-neoforge", version.ref = "jei" }
curios = { group = "top.theillusivec4.curios", name = "curios-neoforge", version.ref = "curios" }
jade = { group = "maven.modrinth", name = "nvQzSEkH", version.ref = "jade" }
ae2 = { group = "org.appliedenergistics", name = "appliedenergistics2", version.ref = "ae2" }
storagedrawers = { group = "maven.modrinth", name = "storagedrawers", version.ref = "storagedrawers" }
sodium = { group = "maven.modrinth", name = "sodium", version.ref = "sodium" }

[plugins]
modDevGradle = { id = "net.neoforged.moddev", version.ref = "modDevGradle" }
lombok = { id = "io.freefair.lombok", version.ref = "lombok" }