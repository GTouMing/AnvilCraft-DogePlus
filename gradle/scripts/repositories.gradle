repositories {
    mavenLocal()
    mavenCentral()
    // AnvilCraft 生态（AnvilCraft / AnvilLib / Ageratum）固定从 Cjsah 取：否则会先落到
    // NeoForge 仓库（那里没有这些 group，网络受限时还会直接连接超时，导致依赖解析失败）。
    exclusiveContent {
        forRepository {
            maven {
                name = "Cjsah Maven"
                url = "https://server.cjsah.net:1002/maven/"
            }
        }
        filter {
            includeGroup "dev.dubhe"
            includeGroup "dev.anvilcraft.lib"
            includeGroup "dev.anvilcraft.resource"
        }
    }
    maven { // Registrate Fork
        name = "Ithundxr Maven"
        url = "https://maven.ithundxr.dev/snapshots"
        content {
            includeGroup "com.tterrag.registrate"
        }
    }
    maven { // JEI
        name = "BlameJared Maven"
        url = "https://maven.blamejared.com"
        content {
            includeGroup "mezz.jei"
        }
    }
    maven { // Curios API
        name = "TheIllusiveC4 Maven"
        url = "https://maven.theillusivec4.top/"
        content {
            includeGroup "top.theillusivec4.curios"
        }
    }
    maven { // Jade（玉）
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}
